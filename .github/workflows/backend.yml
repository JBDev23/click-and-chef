name: Backend
on:
  push:
    branches: [main]
    paths: ["mercadona-backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["mercadona-backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercadona-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mercadona-backend/pom.xml
      - name: Comprobar formato
        run: sh ./mvnw --batch-mode spotless:check
      - name: Compilar y probar con PostgreSQL 17
        run: sh ./mvnw --batch-mode verify
